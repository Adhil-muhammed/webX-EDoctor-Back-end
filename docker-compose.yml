services:
  postgres:
    image: postgres:16-alpine
    container_name: edoctor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edoctor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edoctor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-edoctor_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-edoctor} -d ${POSTGRES_DB:-edoctor_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: edoctor_postgres_data
